# Dependabot opens a pull request each week when a dependency has a new version.
# The "Build APK" workflow runs the tests on each pull request: merge only if it is green.
# Major versions are ignored: they are migrated together, on purpose (AGP + Gradle + Kotlin...).
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Compose, Media3, Lifecycle... updated together to stay compatible
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
