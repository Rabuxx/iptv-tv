name: Build APK

# - push sur main      → APK compilé et disponible en artefact du workflow
# - push d'un tag v*   → APK compilé à la version du tag et publié en Release GitHub
#                        (c'est cette Release que l'app détecte pour se mettre à jour)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      IPTV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      IPTV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      IPTV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version depuis le tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Clé de signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "IPTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Avertissement si pas de clé
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Secret KEYSTORE_BASE64 absent — APK signé avec une clé debug jetable, les mises à jour par-dessus échoueront."

      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Nommer l'APK
        run: |
          VERSION="${VERSION_NAME:-dev-${GITHUB_SHA::7}}"
          cp app/build/outputs/apk/release/app-release.apk "rabux-tv-${VERSION}.apk"
          echo "APK_FILE=rabux-tv-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
