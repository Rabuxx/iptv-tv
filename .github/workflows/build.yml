name: Build APK

# - push on main     -> APK built and available as workflow artifact
# - push of a tag v* -> APK built with the tag version and published as a GitHub Release
#                       (the app checks this Release to update itself)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      IPTV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      IPTV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      IPTV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "IPTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warning if no key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::KEYSTORE_BASE64 secret missing - APK signed with a throwaway debug key, updates will fail."

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          VERSION="${VERSION_NAME:-dev-${GITHUB_SHA::7}}"
          cp app/build/outputs/apk/release/app-release.apk "rabux-tv-${VERSION}.apk"
          # Fixed-name copy: .../releases/latest/download/rabux-tv.apk always points to the latest version
          cp app/build/outputs/apk/release/app-release.apk "rabux-tv.apk"
          echo "APK_FILE=rabux-tv-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_FILE }}
            rabux-tv.apk
          generate_release_notes: true