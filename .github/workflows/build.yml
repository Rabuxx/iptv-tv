name: Build APK

# - pull request (Dependabot...) -> tests + build, no release
# - push on main                 -> tests + APK available as workflow artifact
# - push of a tag v*             -> tests + APK built with the tag version and published as a GitHub Release
#                                   (the app checks this Release to update itself)
# If the tests fail, no APK and no Release are produced.
# Tags with a dash (v0.7.0-beta.1) are published as pre-releases: only the "beta" channel of the app sees them.
# Automatic publishing: a push on main whose iptv.version (gradle.properties) has no tag yet
# builds that version, creates the tag v<version> and publishes the Release - no manual "git tag" needed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      IPTV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      IPTV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      IPTV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Optional services (empty = feature disabled in the app)
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: needed to write the release notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: New version on main?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          V=$(grep -E '^iptv.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -n "$V" ] && ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "New version $V: it will be published"
            echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$V" >> "$GITHUB_ENV"
          else
            echo "Version $V already published: build only"
          fi

      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "IPTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warning if no key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::KEYSTORE_BASE64 secret missing - APK signed with a throwaway debug key, updates will fail."

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            app/build/reports/tests/
            home/build/reports/tests/
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          VERSION="${VERSION_NAME:-dev-${GITHUB_SHA::7}}"
          cp app/build/outputs/apk/release/app-release.apk "rabux-tv-${VERSION}.apk"
          # Fixed-name copy: .../releases/latest/download/rabux-tv.apk always points to the latest version
          cp app/build/outputs/apk/release/app-release.apk "rabux-tv.apk"
          echo "APK_FILE=rabux-tv-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      # Rabux Home stays out of the GitHub Releases on purpose: the updater of Rabux TV
      # installs the first .apk of a release that is not named rabux-tv.apk.
      - name: Name the Rabux Home APK
        run: |
          VERSION="${VERSION_NAME:-dev-${GITHUB_SHA::7}}"
          cp home/build/outputs/apk/release/home-release.apk "rabux-home-${VERSION}.apk"
          echo "HOME_APK_FILE=rabux-home-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.HOME_APK_FILE }}
          path: ${{ env.HOME_APK_FILE }}

      - name: Release notes
        if: env.RELEASE_TAG != ''
        run: |
          # Commit messages since the previous tag: shown in the app ("What's new")
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$GITHUB_SHA"; else RANGE="$GITHUB_SHA"; fi
          git log --no-merges --pretty='- %s' "$RANGE" | grep -v -i -E '^- (bump|merge)' > notes.md || true
          [ -s notes.md ] || echo "- Améliorations et corrections" > notes.md
          cat notes.md

      - name: Publish the Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          # On main, the tag does not exist yet: it is created on this commit
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          body_path: notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            ${{ env.APK_FILE }}
            rabux-tv.apk

  ui-tests:
    # Interface tests on an Android emulator. Separate job: a flaky emulator never blocks a release.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Interface tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Interface test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
